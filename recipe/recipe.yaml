schema_version: 1

context:
  python_min: "3.12"
  version: "0.8.0"

package:
  name: pystormtracker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/P/PyStormTracker/pystormtracker-${{ version }}.tar.gz
  sha256: ed6982e1ef9f197f5326b0d5c1a2d3f4f0d3319eeccb636411a604ea43f061d9

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - stormtracker = pystormtracker.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - pip

  run:
    - python >=${{ python_min }}

    # Core
    - dask-core >=2024.1.0
    - ducc0 >=0.39.0
    - h5netcdf >=1.8.0
    - h5py >=3.11.0
    - msgspec >=0.20.0
    - numba >=0.67.0
    - numpy >=2.5.0
    - scipy >=1.16.1
    - spharmgrid >=0.5.0,<0.6
    - xarray >=2024.9.0

    # EOF
    - xeofs >=3.0.3
    - statsmodels >=0.14.0

    # GRIB
    - cfgrib >=0.9.15.1
    - python-eccodes >=2.46.0

    # NetCDF4
    - netcdf4 >=1.7.2
    - cftime >=1.6.5

    # Zarr / remote storage
    - zarr >=3.0
    - fsspec >=2024.9.0
    - aiohttp !=4.0.0a0, !=4.0.0a1

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - pystormtracker
      pip_check: true
  - script:
      - stormtracker --help

about:
  summary: A High-Performance Cyclone Tracker in Python
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/PyStormTracker/

extra:
  recipe-maintainers:
    - mwyau
